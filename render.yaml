# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are secrets; Render asks for them on first deploy.
services:
  - type: web
    name: cinebook-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # redeploy on every push to main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Browser -> Vercel rewrite -> Render proxy -> app: two proxies in front of us.
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_SECRET
        generateValue: true # Render creates a strong random secret
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false # the Vercel URL, e.g. https://cinebook.vercel.app
      - key: TMDB_READ_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
